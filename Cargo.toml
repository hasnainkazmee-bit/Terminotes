[package]
name = "terminotes"
version = "0.2.2"
edition = "2021"
description = "Terminotes: A note-taker for people spending most of their time inside terminals."
readme = "README.md"
license = "MIT"
keywords = ["cli", "notes", "sqlite", "terminal", "utility"]
categories = ["command-line-utilities"]
exclude = ["notes.txt", "terminotes.db", "plan.md", ".gitignore"]

# THIS IS THE TRICK: Maps the binary name to "tn"
[[bin]]
name = "tn"
path = "src/main.rs"

[[bin]]
name = "terminote"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
