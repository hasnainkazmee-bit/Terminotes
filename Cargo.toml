[package]
name = "terminotes" 
version = "0.1.0"
edition = "2024"
authors = ["Hasnain Kazmee <hasnain.kazmee@sunhub.com>"]
description = "A lightweight note-taker for those who live inside terminals."
readme = "README.md"
license = "MIT"
keywords = ["cli", "notes", "sqlite", "learning", "beginner"]
categories = ["command-line-utilities"]
exclude = ["notes.txt", "terminotes.db", "plan.md", ".gitignore"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
